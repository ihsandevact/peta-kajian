name: Peta Kajian Cron Automation

on:
  schedule:
    # Berjalan otomatis setiap 15 menit
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Pilih cron job yang ingin dijalankan manual'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - youtube
          - telegram
          - push_reminders

jobs:
  run-crons:
    runs-on: ubuntu-latest
    steps:
      - name: 📺 Sync YouTube Live Streams (Setiap 15 Menit)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'youtube' }}
        run: |
          echo "========================================="
          echo "Memeriksa status siaran YouTube Live..."
          echo "========================================="
          APP_HOST="${{ secrets.APP_URL || 'peta-kajian.vercel.app' }}"
          CLEAN_HOST=$(echo "$APP_HOST" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||')
          URL="https://${CLEAN_HOST}/api/cron/youtube-tracker?key=${{ secrets.CRON_SECRET }}"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -m 45 -X GET "$URL" || echo -e "\nHTTP_STATUS:ERROR")
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | sed -e 's|HTTP_STATUS:||')
          echo "Status: $STATUS"
          echo "Response: $BODY"

      - name: 🔔 Check & Send Push Reminders H-2 Jam (Setiap Jam)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'push_reminders' }}
        run: |
          echo "========================================="
          echo "Memeriksa pengingat kajian H-2 jam..."
          echo "========================================="
          APP_HOST="${{ secrets.APP_URL || 'peta-kajian.vercel.app' }}"
          CLEAN_HOST=$(echo "$APP_HOST" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||')
          URL="https://${CLEAN_HOST}/api/cron/push-reminders?key=${{ secrets.CRON_SECRET }}"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -m 45 -X GET "$URL" || echo -e "\nHTTP_STATUS:ERROR")
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | sed -e 's|HTTP_STATUS:||')
          echo "Status: $STATUS"
          echo "Response: $BODY"

      - name: 📱 Scrape Telegram Channels (Jadwal Khusus: 06:00, 12:00, 18:00 WIB)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.target == 'all' || github.event.inputs.target == 'telegram' }}
        run: |
          echo "========================================="
          echo "Mengevaluasi jadwal Telegram Scraper..."
          echo "========================================="
          # Konversi UTC ke jam WIB (UTC = WIB - 7 jam)
          # 23:00 UTC = 06:00 WIB, 05:00 UTC = 12:00 WIB, 11:00 UTC = 18:00 WIB
          CURRENT_HOUR=$(date -u +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$CURRENT_HOUR" = "23" ] || [ "$CURRENT_HOUR" = "05" ] || [ "$CURRENT_HOUR" = "11" ]; then
            echo "Waktu sesuai jadwal (Jam $CURRENT_HOUR:00 UTC). Menjalankan Telegram Scraper..."
            APP_HOST="${{ secrets.APP_URL || 'peta-kajian.vercel.app' }}"
            CLEAN_HOST=$(echo "$APP_HOST" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||')
            URL="https://${CLEAN_HOST}/api/cron/telegram-scraper?key=${{ secrets.CRON_SECRET }}&max=5"
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -m 180 -X GET "$URL" || echo -e "\nHTTP_STATUS:ERROR")
            BODY=$(echo "$RESPONSE" | sed -e '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1 | sed -e 's|HTTP_STATUS:||')
            echo "Status: $STATUS"
            echo "Response: $BODY"
          else
            echo "Melewati Telegram scraper di luar jadwal (hanya berjalan pada 23:00, 05:00, dan 11:00 UTC)."
          fi
